<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c" />
      <stop offset="100%" stop-color="#e53935" />
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="rgba(255,255,255,0.25)" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.15)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="420" height="360" fill="url(#dotPattern)" rx="16" />

  <!-- Cute decorative frame -->
  <rect x="15" y="15" width="390" height="330" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="6,4" rx="12" />

  <!-- Center Icon Content -->
  <g transform="translate(210.0, 155.0)" filter="url(#shadow)">
    
      <g transform="translate(-50, -50)">
        <!-- Couple holding hands under Christmas mistletoe / stars -->
        <circle cx="50" cy="50" r="45" fill="rgba(255,255,255,0.2)"/>
        <!-- Boy and girl silhouette / warm hugs -->
        <circle cx="38" cy="35" r="12" fill="#ffffff"/>
        <circle cx="62" cy="38" r="11" fill="#ffe5ec"/>
        <path d="M 22,75 C 22,54 54,54 54,75 Z" fill="#ffffff"/>
        <path d="M 46,75 C 46,56 78,56 78,75 Z" fill="#ffe5ec"/>
        <!-- Big Glowing Heart -->
        <path d="M 43,22 C 43,17 47,13 50,17 C 53,13 57,17 57,22 C 57,27 50,32 50,32 C 50,32 43,27 43,22 Z" fill="#e63946"/>
      </g>
    
  </g>

  <!-- Title & Subtitle -->
  <text x="210.0" y="296" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="27" font-weight="bold" fill="#ffffff" letter-spacing="0.8">
    Tú y Yo Por Siempre
  </text>
  <text x="210.0" y="322" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.92)">
    Nuestra Navidad Juntos
  </text>

  <!-- Decorative mini hearts -->
  <g fill="rgba(255,255,255,0.6)">
    <path d="M 30,35 C 30,30 36,26 40,31 C 44,26 50,30 50,35 C 50,42 40,48 40,48 C 40,48 30,42 30,35 Z" transform="scale(0.8)"/>
    <path d="M 370,35 C 370,30 376,26 380,31 C 384,26 390,30 390,35 C 390,42 380,48 380,48 C 380,48 370,42 370,35 Z" transform="scale(0.8)"/>
  </g>
</svg>