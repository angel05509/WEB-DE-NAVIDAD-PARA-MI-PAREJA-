<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbc2eb" />
      <stop offset="100%" stop-color="#a6c1ee" />
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="rgba(255,255,255,0.25)" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.15)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="420" height="360" fill="url(#dotPattern)" rx="16" />

  <!-- Cute decorative frame -->
  <rect x="15" y="15" width="390" height="330" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="6,4" rx="12" />

  <!-- Center Icon Content -->
  <g transform="translate(210.0, 155.0)" filter="url(#shadow)">
    
      <g transform="translate(-45, -45)">
        <circle cx="45" cy="45" r="40" fill="#ffd166"/>
        <!-- Big happy smile -->
        <circle cx="30" cy="35" r="6" fill="#2b2b2b"/>
        <circle cx="60" cy="35" r="6" fill="#2b2b2b"/>
        <path d="M 25,48 Q 45,75 65,48 Z" fill="#e63946"/>
        <path d="M 35,50 Q 45,62 55,50 Z" fill="#ff758f"/>
        <!-- Cheek blush -->
        <circle cx="20" cy="46" r="6" fill="#ff758f" opacity="0.6"/>
        <circle cx="70" cy="46" r="6" fill="#ff758f" opacity="0.6"/>
        <!-- Party sparkles -->
        <path d="M 10,15 L 18,20 L 10,25 Z" fill="#fff"/>
        <path d="M 80,15 L 72,20 L 80,25 Z" fill="#fff"/>
      </g>
    
  </g>

  <!-- Title & Subtitle -->
  <text x="210.0" y="305" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="1">
    Nuestras Caras Chistosas
  </text>
  <text x="210.0" y="330" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.9)">
    La magia de reír juntos
  </text>

  <!-- Decorative mini hearts -->
  <g fill="rgba(255,255,255,0.6)">
    <path d="M 30,35 C 30,30 36,26 40,31 C 44,26 50,30 50,35 C 50,42 40,48 40,48 C 40,48 30,42 30,35 Z" transform="scale(0.8)"/>
    <path d="M 370,35 C 370,30 376,26 380,31 C 384,26 390,30 390,35 C 390,42 380,48 380,48 C 380,48 370,42 370,35 Z" transform="scale(0.8)"/>
  </g>
</svg>